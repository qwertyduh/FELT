# Local dev: `docker compose up -d redis` + `npm run dev`.
# Prod-like check: `docker compose up -d --build` (server on http://localhost:${SERVER_PORT:-3001}).
services:
  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - '${SERVER_PORT:-3001}:3000'
    restart: unless-stopped

volumes:
  redis-data:
