# Local dev: `docker compose up -d redis` + `npm run dev`.
# The server image runs in the local sandbox instead: `npm run sandbox:up` (docs/DEPLOY.md).
services:
  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
